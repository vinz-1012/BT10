spring.application.name=JWT_springboot3
server.port=8080

# ==========================================
# CẤU HÌNH KẾT NỐI CSDL MICROSOFT SQL SERVER
# ==========================================
# Thay đổi localhost, port 1433, tên CSDL databaseName và tài khoản/mật khẩu sa phù hợp với máy của bạn
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jwt_demo;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# ddl-auto=update: tự động tạo/cập nhật bảng khi chạy ứng dụng
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ==========================================
# CẤU HÌNH JWT (JSON WEB TOKEN)
# secret-key: Chuỗi bí mật mã hóa Base64 (256-bit)
# expiration-time: Thời gian sống của token (3600000 ms = 1 giờ)
# ==========================================
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=3600000
