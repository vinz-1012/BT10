<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Người Dùng - JWT Spring Boot 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 10%, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.15rem;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .btn-nav {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-profile {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .btn-profile:hover {
            background: rgba(99, 102, 241, 0.35);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.35);
        }

        .table-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .table-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-count {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            font-weight: 600;
        }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            font-size: 0.9rem;
            color: #f1f5f9;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .user-avatar-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">JWT Spring Boot 3</div>
        <div class="nav-links">
            <a href="/user/me" class="btn-nav btn-profile">Hồ Sơ Của Tôi (/user/me)</a>
            <button onclick="handleLogout()" class="btn-nav btn-logout">Đăng Xuất</button>
        </div>
    </div>

    <div class="table-card" id="mainContainer">
        <div class="loading" id="loadingText">Đang tải danh sách người dùng từ API /users...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadUsers);

        async function loadUsers() {
            const container = document.getElementById('mainContainer');
            const token = localStorage.getItem('jwtToken');

            if (!token) {
                renderUnauthorized('Bạn chưa đăng nhập hoặc phiên làm việc đã hết hạn!');
                return;
            }

            try {
                const response = await fetch('/users', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const users = await response.json();
                    renderTable(users);
                } else {
                    const err = await response.json();
                    renderUnauthorized(err.detail || err.access_denied_reason || 'Token không hợp lệ hoặc không có quyền truy cập!');
                }
            } catch (error) {
                renderUnauthorized('Không thể kết nối đến máy chủ API: ' + error.message);
            }
        }

        function renderTable(users) {
            let rowsHtml = '';
            users.forEach(u => {
                const initial = (u.fullName || u.email || 'U').charAt(0).toUpperCase();
                const createdAt = u.createdAt ? new Date(u.createdAt).toLocaleDateString('vi-VN') : 'N/A';

                rowsHtml += `
                    <tr>
                        <td style="font-weight: 600; color: #a5b4fc;">#${u.id}</td>
                        <td>
                            <div class="user-avatar-cell">
                                <div class="avatar-sm">${initial}</div>
                                <span style="font-weight: 600;">${escapeHtml(u.fullName || 'N/A')}</span>
                            </div>
                        </td>
                        <td>${escapeHtml(u.email)}</td>
                        <td style="color: var(--text-muted);">${createdAt}</td>
                    </tr>
                `;
            });

            document.getElementById('mainContainer').innerHTML = `
                <div class="table-header">
                    <h2>
                        Danh Sách Người Dùng
                        <span class="badge-count">${users.length} tài khoản</span>
                    </h2>
                    <button class="btn-refresh" onclick="loadUsers()">Làm mới</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Họ Và Tên</th>
                                <th>Email (Tên đăng nhập)</th>
                                <th>Ngày tạo</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml || '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Chưa có người dùng nào</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderUnauthorized(message) {
            document.getElementById('mainContainer').innerHTML = `
                <div class="alert-error">
                    <h3 style="margin-bottom: 8px;">Truy Cập Bị Từ Chối</h3>
                    <p style="margin-bottom: 20px;">${escapeHtml(message)}</p>
                    <a href="/auth/login" class="btn-nav btn-profile" style="padding: 10px 24px; text-decoration: none;">Đăng Nhập Lại</a>
                </div>
            `;
        }

        function handleLogout() {
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('expiresIn');
            window.location.href = '/auth/login';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
